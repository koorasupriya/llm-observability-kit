# Observability stack: app -> OTel Collector -> (traces) Phoenix, (metrics) Prometheus -> Grafana
#   docker compose -f deploy/docker-compose.yml up -d
# Phoenix UI: http://localhost:6006   Grafana: http://localhost:3000 (admin/admin)   Prometheus: http://localhost:9090
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP (point the app here)
    depends_on: [phoenix]

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on: [otel-collector]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]
